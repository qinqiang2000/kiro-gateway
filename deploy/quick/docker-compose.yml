# Standalone quick-gateway deployment (project: quick-gateway).
# Runs one container joined to the shared `kiro-gateway-network` so litellm can
# reach it as http://quick-gateway:8000. It serves ONLY the Anthropic-compatible
# /quick/v1/messages endpoint backed by the Amazon Quick DataPlane. The Kiro /v1/*
# routes in the same image are inert here (no real Kiro creds); REFRESH_TOKEN=dummy
# only satisfies main.py's startup credential check.
#
# The published port is bound to 127.0.0.1 only: quick-gateway is NOT exposed to the
# internet — litellm (on kiro-gateway-network) is the auth boundary. Localhost 8000
# stays available on the box for smoke tests / SSH tunnels.
services:
  quick-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: quick-gateway:latest
    container_name: quick-gateway
    ports:
      - "127.0.0.1:8000:8000"   # localhost-only; reachable in-cluster as quick-gateway:8000
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=INFO
      - DEBUG_MODE=off
      # Satisfy main.py startup guard; Kiro routes unused in this container.
      - REFRESH_TOKEN=dummy-quick-only
      - PROXY_API_KEY=quick-gw-kingdee-2026
      # Portable Quick creds (scp'd from mac). Container runs as user 'kiro'.
      - QUICK_CREDS_FILE=/home/kiro/.quickwork/gateway-creds.json
      # Force every request to the best authorized Opus (opus-5 is IAM-denied).
      - QUICK_FORCE_MODEL=us.anthropic.claude-opus-4-8
      # Model watch: poll Quick's PUBLIC model registry hourly and alert on a newer
      # model. The webhook URL is a secret -> keep it in /opt/quick-gateway/.env
      # (docker compose reads that file automatically); never commit it here.
      - QUICK_MODEL_WATCH_INTERVAL=3600
      - QUICK_ALERT_WEBHOOK=${QUICK_ALERT_WEBHOOK:-}
    volumes:
      - ./quickwork:/home/kiro/.quickwork
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# Join the existing prod network (created by the kiro-gateway stack) so litellm can
# resolve `quick-gateway` by name. Declared external — we never create/modify it.
networks:
  default:
    name: kiro-gateway-network
    external: true
