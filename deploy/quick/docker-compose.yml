# Standalone quick-gateway deployment (project: quick-gateway).
# Runs one container joined to the shared `kiro-gateway-network` so litellm can
# reach it as http://quick-gateway:8000. It serves ONLY the Anthropic-compatible
# /quick/v1/messages endpoint backed by the Amazon Quick DataPlane. The Kiro /v1/*
# routes in the same image are inert here (no real Kiro creds); REFRESH_TOKEN=dummy
# only satisfies main.py's startup credential check.
#
# The INFERENCE port is bound to 127.0.0.1 only: quick-gateway is NOT exposed to the
# internet — litellm (on kiro-gateway-network) is the auth boundary. Localhost 8000
# stays available on the box for smoke tests / SSH tunnels.
#
# Port 9090 IS public, and serves a different app (quick/status_app.py): a read-only
# per-account quota page with no inference route and no credential material on it.
services:
  quick-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: quick-gateway:latest
    container_name: quick-gateway
    ports:
      - "127.0.0.1:8000:8000"   # inference: localhost-only; in-cluster as quick-gateway:8000
      - "9090:9090"             # status page ONLY (read-only quota view at /quick), public
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - LOG_LEVEL=INFO
      - DEBUG_MODE=off
      # Satisfy main.py startup guard; Kiro routes unused in this container.
      - REFRESH_TOKEN=dummy-quick-only
      - PROXY_API_KEY=quick-gw-kingdee-2026
      # Portable Quick creds (scp'd from mac). Container runs as user 'kiro'.
      # One file per account, and the FILENAME IS THE ACCOUNT NAME:
      # gateway-creds-<name>.json -> account "<name>" (a bare gateway-creds.json
      # would be "default"). Every match becomes a pool member, so adding an
      # account is "copy one more file in" (discovery re-scans, no restart). Named
      # after the person who owns the Quick seat, which is why the status page
      # must stay token-gated (QUICK_STATUS_TOKEN below).
      # This one is only the fallback single-account manager (CLI probes, keep-alive
      # when the pool is empty), so it must point at a file that actually exists.
      - QUICK_CREDS_FILE=/home/kiro/.quickwork/gateway-creds-qin_qiang@kingdee.com.json
      - QUICK_CREDS_DIR=/home/kiro/.quickwork
      # Pool: how many accounts one request may try before giving up.
      - QUICK_POOL_MAX_ATTEMPTS=2
      # Cap on a quota bench. Quick's own resetsAt can be weeks out; capping it means
      # an admin raising the limit profile is noticed within 2 h (the next half-open
      # trial) instead of at the monthly reset. Cost: a few failed first attempts a
      # day, each of which fails over to the other account.
      - QUICK_POOL_MAX_QUOTA_COOLDOWN_SECONDS=7200
      # Prefer the account that still has monthly units; a spent one is picked last
      # but never dropped from the pool. See quick/README.md "Overage preference".
      - QUICK_POOL_OVERAGE_POLICY=avoid
      # Force every request to the best authorized Opus (opus-5 is IAM-denied).
      - QUICK_FORCE_MODEL=us.anthropic.claude-opus-4-8
      # Model watch: poll Quick's PUBLIC model registry every 5 h and alert on a
      # newer model. The webhook URL is a secret -> keep it in /opt/quick-gateway/.env
      # (docker compose reads that file automatically); never commit it here.
      - QUICK_MODEL_WATCH_INTERVAL=18000
      # Session-usage watch: check the account's session allowance hourly and alert
      # ONCE when less than 10% of it is left (re-arms after it recovers).
      - QUICK_SESSION_WATCH_INTERVAL=3600
      - QUICK_SESSION_ALERT_REMAINING_PCT=10
      # Shared by both watches.
      - QUICK_ALERT_WEBHOOK=${QUICK_ALERT_WEBHOOK:-}
      # Public status page: per-account remaining quota, read-only, its own app on
      # its own port. It serves NO inference route — that is why 9090 can be public
      # while 8000 stays bound to localhost. Set QUICK_STATUS_TOKEN in .env to gate it.
      - QUICK_STATUS_PORT=9090
      - QUICK_STATUS_HOST=0.0.0.0
      # Served under this path only; every other path 404s, so a scanner sweeping
      # "/" finds nothing. Obscurity, not a boundary — QUICK_STATUS_TOKEN is that.
      - QUICK_STATUS_PATH=/quick
      # REQUIRED here: the page's labels are people (account files named after their
      # owner, litellm key aliases), and 9090 is on the internet.
      - QUICK_STATUS_TOKEN=${QUICK_STATUS_TOKEN:-}
      # Status page tab 2: which virtual key spent this channel's quota this month.
      # Read from litellm over the shared docker network; the master key is a secret
      # and lives in .env only (this repo is public).
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
      - LITELLM_QUICK_MODELS=anthropic/claude-opus-quick,claude-opus-quick
    volumes:
      - ./quickwork:/home/kiro/.quickwork
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

# Join the existing prod network (created by the kiro-gateway stack) so litellm can
# resolve `quick-gateway` by name. Declared external — we never create/modify it.
networks:
  default:
    name: kiro-gateway-network
    external: true
